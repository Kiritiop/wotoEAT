name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend offline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wotoeat-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: wotoeat-api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run offline test scripts
        env:
          # ai/claude.py refuses to import without a key; the offline tests
          # never call Groq, so any non-empty value works.
          GROQ_API_KEY: ci-dummy-key
        run: |
          fail=0
          for t in test_scraper_ssrf test_clean_json test_models test_profile_constraints \
                   test_meal_prompt test_image_match test_image_endpoint test_guest_endpoints; do
            echo "--- $t"
            python tests/$t.py || fail=1
          done
          exit $fail

  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wotoeat-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wotoeat-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Unit tests (pure logic)
        run: npm test

  emoji-scan:
    name: No emojis in app source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for emoji characters
        run: |
          if grep -rnP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{FE0F}]' \
            wotoeat-app/app wotoeat-app/components wotoeat-app/locales wotoeat-app/constants wotoeat-api/ai \
            --include='*.ts' --include='*.tsx' --include='*.py'; then
            echo "Emoji characters found; the product rule is no emojis in app source."
            exit 1
          fi
          echo "Clean."
